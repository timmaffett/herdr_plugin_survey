services:
  - type: web
    name: herdr-plugins-survey
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
    domains:
      - herdrplugins.dev
      - www.herdrplugins.dev
